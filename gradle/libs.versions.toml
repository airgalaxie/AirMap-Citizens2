[versions]
pluginVersion = "0.42"
apiVersion = "26.3"
# AirMap and Dynmap share the same marker API, so the plugin compiles against Dynmap Core API 3.8
dynmapCoreApi = "3.8"
spigotApi = "26.3-R0.1-SNAPSHOT"
citizensApi = "2.0.44-SNAPSHOT"
javaRelease = "17"

[libraries]
dynmapCoreApi = { module = "us.dynmap:DynmapCoreAPI", version.ref = "dynmapCoreApi" }
spigotApi = { module = "org.spigotmc:spigot-api", version.ref = "spigotApi" }
citizensApi = { module = "net.citizensnpcs:citizensapi", version.ref = "citizensApi" }
